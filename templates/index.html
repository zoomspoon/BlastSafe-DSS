<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BlastSafe DSS — Monitor de Dispersión</title>
    <link rel="stylesheet" href="https://cloudflare.com" />
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; display: flex; height: 100vh; background: #111; color: #eee; }
        #sidebar { width: 340px; padding: 20px; background: #1e1e24; overflow-y: auto; border-right: 1px solid #333; }
        #map { flex: 1; height: 100%; background: #1a1a1a; }
        input, button { width: 100%; padding: 8px; margin: 6px 0 12px; border-radius: 6px; border: 1px solid #444; background: #2b2b33; color: #fff; box-sizing: border-box; }
        button { background: #2563eb; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .btn-sec { background: #374151; margin-bottom: 8px; font-weight: normal; }
        .btn-sec:hover { background: #4b5563; }
        .badge { padding: 8px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 12px; }
        .GO { background: #166534; color: #bbf7d0; }
        .NO_GO { background: #991b1b; color: #fecaca; }
        ul { padding-left: 18px; font-size: 0.9rem; color: #fca5a5; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>BlastSafe DSS</h2>
        <label>Latitud:</label>
        <input type="number" id="lat" step="0.0001" value="40.8065">
        <label>Longitud:</label>
        <input type="number" id="lon" step="0.0001" value="-91.2468">
        <label>Masa Explosivo (kg):</label>
        <input type="number" id="masa" value="4400">
        <button onclick="cargarSimulacion()">Simular Escenario (24h)</button>

        <hr style="border-color: #333; margin: 14px 0;">
        <label>Ventana Horaria: <strong id="lbl-hora">+0h</strong></label>
        <input type="range" id="slider" min="0" max="23" value="0" oninput="renderizarHora(this.value)">

        <div id="estado-box" class="badge GO">Iniciando...</div>
        <div id="detalles" style="font-size: 0.92rem; line-height: 1.5;"></div>
        <ul id="lista-alertas"></ul>

        <hr style="border-color: #333; margin: 14px 0;">
        <button class="btn-sec" onclick="descargarGeoJSON()">Descargar GeoJSON (24h)</button>
        <button class="btn-sec" onclick="descargarCSV()">Descargar Reporte CSV</button>
    </div>

    <div id="map"></div>

    <script src="https://cloudflare.com"></script>
    <script>
        let map = null;
        let capaPluma = null;
        let marcadorOrigen = null;
        let capaAlertas = null;
        let datosSimulacion = [];

        // Inicializar mapa de forma segura
        try {
            map = L.map('map').setView([40.8065, -91.2468], 11);
            const hostEsri = "https:" + "//://arcgisonline.com";
            const rutaEsri = hostEsri + "/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
            L.tileLayer(rutaEsri, { attribution: 'Esri World Imagery' }).addTo(map);
            capaAlertas = L.layerGroup().addTo(map);
        } catch (err) {
            document.getElementById('estado-box').innerText = "Error cargando Leaflet: " + err.message;
        }

        async function cargarSimulacion() {
            const lat = document.getElementById('lat').value;
            const lon = document.getElementById('lon').value;
            const masa = document.getElementById('masa').value;
            const box = document.getElementById('estado-box');

            box.innerText = "Consultando clima y simulando...";
            try {
                const resp = await fetch(`/api/simular?lat=${lat}&lon=${lon}&masa_kg=${masa}`);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();

                datosSimulacion = data.horas || [];
                const slider = document.getElementById('slider');
                slider.max = Math.max(0, datosSimulacion.length - 1);
                slider.value = 0;

                if (map) {
                    map.setView([lat, lon], 11);
                    if (marcadorOrigen) map.removeLayer(marcadorOrigen);
                    marcadorOrigen = L.marker([lat, lon]).addTo(map).bindPopup("Punto de Detonación");
                }

                renderizarHora(0);
            } catch (e) {
                box.className = "badge NO_GO";
                box.innerText = "Error API: " + e.message;
            }
        }

        function renderizarHora(idx) {
            const index = parseInt(idx, 10);
            document.getElementById('lbl-hora').innerText = `+${index}h`;

            if (!datosSimulacion.length) return;
            const h = datosSimulacion[index];
            document.getElementById('lbl-hora').innerText = `+${index}h (${h.hora})`;

            const box = document.getElementById('estado-box');
            box.className = `badge ${h.estado}`;
            box.innerText = h.estado === "GO" ? "GO — VENTANA SEGURA" : "NO_GO — ALTO RIESGO";

            document.getElementById('detalles').innerHTML = `
                <b>Viento:</b> ${h.viento_ms} m/s (Origen: ${h.direccion_origen}°)<br>
                <b>Inversión Térmica:</b> ${h.inversion ? "SÍ (Peligro)" : "No"}<br>
                <b>Zonas afectadas:</b> ${h.afectados.length}
            `;

            const lista = document.getElementById('lista-alertas');
            lista.innerHTML = h.afectados.map(z => `<li>${z.nombre} (${z.tipo})</li>`).join('');

            if (!map) return;
            if (capaPluma) map.removeLayer(capaPluma);
            if (capaAlertas) capaAlertas.clearLayers();

            if (h.pluma_geojson) {
                const color = h.estado === "GO" ? "#22c55e" : "#ef4444";
                capaPluma = L.geoJSON(h.pluma_geojson, {
                    style: { color: color, fillColor: color, weight: 2, fillOpacity: 0.45 }
                }).addTo(map);
            }

            h.afectados.forEach(z => {
                L.circleMarker([z.lat, z.lon], { radius: 7, color: "#a855f7", fillOpacity: 0.9 })
                 .bindPopup(`${z.nombre} (${z.tipo})`)
                 .addTo(capaAlertas);
            });
        }

        function descargarArchivo(contenido, nombre, tipoMime) {
            const blob = new Blob([contenido], { type: tipoMime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = nombre;
            a.click();
            URL.revokeObjectURL(url);
        }

        function descargarGeoJSON() {
            if (!datosSimulacion.length) return;
            const features = datosSimulacion
                .filter(h => h.pluma_geojson !== null)
                .map(h => ({
                    type: "Feature",
                    geometry: h.pluma_geojson,
                    properties: {
                        hora: h.hora,
                        estado: h.estado,
                        viento_ms: h.viento_ms,
                        direccion_origen: h.direccion_origen,
                        inversion_termica: h.inversion,
                        zonas_afectadas: h.afectados.length
                    }
                }));
            const fc = { type: "FeatureCollection", features: features };
            descargarArchivo(JSON.stringify(fc, null, 2), "blastsafe_plumas_24h.geojson", "application/geo+json");
        }

        function descargarCSV() {
            if (!datosSimulacion.length) return;
            const filas = ["Hora,Estado,Viento_ms,Direccion_Origen,Inversion_Termica,Zonas_Afectadas,Detalle_Zonas"];
            datosSimulacion.forEach(h => {
                const nombres = h.afectados.map(z => `${z.nombre} (${z.tipo})`).join(" | ") || "Ninguna";
                filas.push(`"${h.hora}","${h.estado}",${h.viento_ms},${h.direccion_origen},${h.inversion},${h.afectados.length},"${nombres}"`);
            });
            descargarArchivo(filas.join("\n"), "blastsafe_reporte_24h.csv", "text/csv;charset=utf-8;");
        }

        cargarSimulacion();
    </script>
</body>
</html>
